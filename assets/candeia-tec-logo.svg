    </radialGradient>
    <radialGradient id="flameOut" cx="32" cy="27" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset=".6" stop-color="#FF9A2E"/>
