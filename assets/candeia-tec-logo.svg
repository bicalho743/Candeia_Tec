    <circle cx="54" cy="43" r="1.7"/><circle cx="52" cy="54" r="1.5"/>
  </g>

  <ellipse cx="32" cy="58" rx="22" ry="5" fill="url(#floor)"/>
  <!-- corpo da vela -->
  <path d="M24 34.5 C24 33.4 27.6 32.6 32 32.6 C36.4 32.6 40 33.4 40 34.5 V56 C40 57.3 36.4 58.2 32 58.2 C27.6 58.2 24 57.3 24 56 Z" fill="url(#wax)"/>
  <path d="M24 34.5 C24 33.4 27.6 32.6 32 32.6 C36.4 32.6 40 33.4 40 34.5 V56 C40 57.3 36.4 58.2 32 58.2 C27.6 58.2 24 57.3 24 56 Z" fill="url(#litbody)"/>
  <!-- topo derretido -->
  <ellipse cx="32" cy="34.5" rx="8" ry="1.9" fill="#F7EFDF"/>
  <ellipse cx="32" cy="34.6" rx="6.2" ry="1.2" fill="url(#glowtop)"/>
