    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A45C" stop-opacity=".15"/>
      <stop offset="1" stop-color="#E2BE74" stop-opacity=".9"/>
