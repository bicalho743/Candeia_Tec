      <stop offset=".5" stop-color="#FF8A1F" stop-opacity=".1"/>
      <stop offset="1" stop-color="#FF8A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9AC94"/>
      <stop offset=".22" stop-color="#F3ECDD"/>
      <stop offset=".5" stop-color="#FFFBF2"/>
      <stop offset=".8" stop-color="#E6DCC8"/>
      <stop offset="1" stop-color="#9E917A"/>
    </linearGradient>
    <radialGradient id="glowtop" cx="32" cy="33" r="9" gradientUnits="userSpaceOnUse">
