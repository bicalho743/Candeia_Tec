  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="24" r="30" fill="url(#halo)"/>

  <!-- trilhas de circuito saindo da base da vela -->
  <g fill="none" stroke="#D9B46A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M24 50 H16 V43 H10"/>
    <path d="M24 54 H12"/>
    <path d="M40 50 H48 V43 H54"/>
    <path d="M40 54 H52"/>
  </g>
  <g fill="#E8C47C">
