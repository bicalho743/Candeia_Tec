  <path d="M26.2 35.6 C26.2 37.5 25.6 39.6 26.4 40.6 C27.1 41.4 27.6 39.4 27.5 36.2 Z" fill="#FBF5E9"/>
  <path d="M36.8 35.8 C36.9 38.2 37.6 41.8 36.7 43.2 C35.9 44.3 35.5 41 35.6 36.1 Z" fill="#F6EEDD"/>
  <!-- pavio -->
  <path d="M32 34 C32 32.4 32.4 31.6 31.8 30.6" stroke="#2A2118" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- chama -->
  <path d="M32 10.5 C35.6 15.8 38.2 19.6 38.2 24.2 C38.2 28.3 35.4 31.2 32 31.2 C28.6 31.2 25.8 28.3 25.8 24.2 C25.8 20.6 28.4 17.6 30.2 15.2 C30.4 17.6 31.2 19 32.4 19.6 C31.8 16.6 31.2 13.6 32 10.5 Z" fill="url(#flameOut)"/>
  <path d="M32 17.8 C33.8 20.6 35 22.6 35 25 C35 27.4 33.6 29.2 32 29.2 C30.4 29.2 29 27.4 29 25 C29 22.6 30.2 20.6 32 17.8 Z" fill="url(#flameIn)"/>
  <ellipse cx="32" cy="29.4" rx="1.6" ry="1.1" fill="#6FA8FF" opacity=".75"/>
</svg>
